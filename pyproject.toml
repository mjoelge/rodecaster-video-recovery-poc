[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rodecaster-video-recovery-poc"
version = "0.1.0"
description = "A privacy-safe proof of concept for fragmented MP4/MOV recovery"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
rvc-catalog = "rvc_poc.catalog:main"
rvc-rebuild = "rvc_poc.rebuild:main"
rvc-scan = "rvc_poc.scan:main"
rvc-capture = "rvc_poc.capture:main"

[tool.setuptools.packages.find]
where = ["src"]

